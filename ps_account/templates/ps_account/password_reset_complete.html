{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пароль изменен | TNK ocenka</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'deps/images/logo.ico' %}" sizes="32x32">
    <link rel="stylesheet" href="{% static 'deps/css/styles1.css' %}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-color: #B1454A;
            --secondary-color: #C85F63;
            --accent-color: #D87A7E;
            --dark-bg: #2D2D2D;
            --text-color: #333333;
            --light-text: #FFFFFF;
            --form-bg: #FFFFFF;
            --light-bg: #F5EDED;
            --white: #FFFFFF;
            --heading-font: 'Outfit', sans-serif;
            --body-font: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            font-family: var(--body-font);
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .message-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 40px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .message-container h1 {
            font-family: var(--heading-font);
            color: var(--text-color);
            margin-bottom: 25px;
            font-size: 28px;
        }

        .message-container p {
            color: var(--text-color);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .message-icon {
            margin-bottom: 25px;
            color: var(--primary-color);
            font-size: 60px;
        }

        .login-btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(177,69,74,0.2);
        }
    </style>
</head>
<body>
    <!-- Вставляем шапку -->
    <header class="header">
      <div class="container">
        <div class="header-content">
          <a href="/" class="logo">TNK ocenka</a>
          <nav class="menu">
            <a href="{% url 'main:index' %}#services" class="menu-item">Услуги</a>
            <a href="{% url 'main:index' %}#testimonials" class="menu-item">Отзывы</a>
            <a href="{% url 'main:index' %}#contact" class="menu-item">Контакты</a>
            <a href="{% url 'ps_account:login' %}" class="btn btn-secondary btn-sm">
              <i data-lucide="log-in" class="icon-sm"></i>
              Вход / Регистрация
            </a>
            <a href="https://wa.me/77026264998" target="_blank" class="btn btn-primary btn-sm">
              <i data-lucide="phone" class="icon-sm"></i>
              Связаться
            </a>
          </nav>
          <button class="mobile-menu-btn">
            <i data-lucide="menu" class="icon"></i>
          </button>
        </div>
      </div>
      <div class="mobile-menu">
        <div class="container">
          <nav class="mobile-nav">
            <a href="{% url 'main:index' %}#services" class="menu-item">Услуги</a>
            <a href="{% url 'main:index' %}#testimonials" class="menu-item">Отзывы</a>
            <a href="{% url 'main:index' %}#contact" class="menu-item">Контакты</a>
            <a href="{% url 'ps_account:login' %}" class="btn btn-secondary btn-sm">
              <i data-lucide="log-in" class="icon-sm"></i>
              Вход / Регистрация
            </a>
            <a href="https://wa.me/77026264998" target="_blank" class="btn btn-primary btn-sm">
              <i data-lucide="phone" class="icon-sm"></i>
              Связаться
            </a>
          </nav>
        </div>
      </div>
    </header>

    <main>
        <div class="message-container">
            <div class="message-icon">
                <i data-lucide="check-circle"></i>
            </div>
            <h1>Пароль успешно изменен</h1>
            <p>Ваш пароль был изменен. Теперь вы можете войти в свой аккаунт с новым паролем.</p>
            <a href="{% url 'ps_account:login' %}" class="login-btn">Войти в аккаунт</a>
        </div>
    </main>

    <script>
        lucide.createIcons();
        // Логика мобильного меню
        const menuBtn = document.querySelector('.mobile-menu-btn');
        const mobileMenu = document.querySelector('.mobile-menu');
        if(menuBtn && mobileMenu) {
            menuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('active');
                const icon = menuBtn.querySelector('i');
                if (mobileMenu.classList.contains('active')) {
                    icon.setAttribute('data-lucide', 'x');
                } else {
                    icon.setAttribute('data-lucide', 'menu');
                }
                lucide.createIcons(); 
            });
        }
    </script>
</body>
</html>
