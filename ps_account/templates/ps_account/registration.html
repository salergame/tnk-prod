{% load static socialaccount %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация пользователя</title>
    <link rel="stylesheet" href="{% static 'deps/css/account_style.css' %}">
    <style>
        .password-wrapper {
            position: relative;
            width: 100%;
        }
        .password-wrapper input {
            width: calc(100% - 40px); /* Оставляем место для иконки */
        }
        .toggle-password {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="{% url 'main:index' %}">Главная</a>
            <a href="{% url 'ps_account:login' %}">Войти</a>
        </nav>
        <h1>Регистрация пользователя</h1>
        <div class="registration-section">
            <form action="{% url 'ps_account:registration' %}" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Имя пользователя:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password1">Пароль:</label>
                    <div class="password-wrapper">
                        <input type="password" id="password1" name="password1" required>
                        <span id="togglePassword1" class="toggle-password">
                            <!-- Иконка глаза -->
                            <svg id="eyeOpen1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" style="display: none;">
                                <path d="M12 4.5C7.30558 4.5 3.32203 7.36251 1.5 12C3.32203 16.6375 7.30558 19.5 12 19.5C16.6944 19.5 20.6779 16.6375 22.5 12C20.6779 7.36251 16.6944 4.5 12 4.5ZM12 16.5C9.51472 16.5 7.5 14.4853 7.5 12C7.5 9.51472 9.51472 7.5 12 7.5C14.4853 7.5 16.5 9.51472 16.5 12C16.5 14.4853 14.4853 16.5 12 16.5ZM12 9C10.6203 9 9.5 10.1203 9.5 11.5C9.5 12.8797 10.6203 14 12 14C13.3797 14 14.5 12.8797 14.5 11.5C14.5 10.1203 13.3797 9 12 9Z"/>
                            </svg>
                            <!-- Иконка перечеркнутого глаза -->
                            <svg id="eyeClosed1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                                <path d="M12 5C7 5 2.73 7.61 1 12C1.67 13.87 2.77 15.44 4.18 16.63L5.61 15.2C4.49 14.3 3.62 13.19 3.05 12C4.5 8.67 7.68 6.5 12 6.5C12.93 6.5 13.8 6.65 14.6 6.91L16.14 5.37C14.96 5.13 13.5 5 12 5ZM17.45 9.13L19.26 7.32C19.53 7.68 19.79 8.05 20.04 8.44L18.64 9.84C18.31 9.21 17.91 8.62 17.45 9.13ZM19.87 5.87L18.5 4.5L3.5 19.5L4.87 20.87L7.42 18.32C8.32 18.76 9.32 19 10.38 19C15.32 19 19.26 16.39 21 12C20.41 10.9 19.62 9.93 18.67 9.14L20.05 7.76C20.79 8.63 21.5 9.72 22.08 11C20.53 14.87 16.5 17 12 17C10.83 17 9.72 16.79 8.7 16.4L11 14.1C11.61 14.35 12.29 14.5 13 14.5C14.93 14.5 16.5 12.93 16.5 11C16.5 10.32 16.35 9.68 16.1 9.07L19.87 5.87Z"/>
                            </svg>
                        </span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password2">Подтвердите пароль:</label>
                    <div class="password-wrapper">
                        <input type="password" id="password2" name="password2" required>
                        <span id="togglePassword2" class="toggle-password">
                            <!-- Иконка глаза -->
                            <svg id="eyeOpen2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" style="display: none;">
                                <path d="M12 4.5C7.30558 4.5 3.32203 7.36251 1.5 12C3.32203 16.6375 7.30558 19.5 12 19.5C16.6944 19.5 20.6779 16.6375 22.5 12C20.6779 7.36251 16.6944 4.5 12 4.5ZM12 16.5C9.51472 16.5 7.5 14.4853 7.5 12C7.5 9.51472 9.51472 7.5 12 7.5C14.4853 7.5 16.5 9.51472 16.5 12C16.5 14.4853 14.4853 16.5 12 16.5ZM12 9C10.6203 9 9.5 10.1203 9.5 11.5C9.5 12.8797 10.6203 14 12 14C13.3797 14 14.5 12.8797 14.5 11.5C14.5 10.1203 13.3797 9 12 9Z"/>
                            </svg>
                            <!-- Иконка перечеркнутого глаза -->
                            <svg id="eyeClosed2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                                <path d="M12 5C7 5 2.73 7.61 1 12C1.67 13.87 2.77 15.44 4.18 16.63L5.61 15.2C4.49 14.3 3.62 13.19 3.05 12C4.5 8.67 7.68 6.5 12 6.5C12.93 6.5 13.8 6.65 14.6 6.91L16.14 5.37C14.96 5.13 13.5 5 12 5ZM17.45 9.13L19.26 7.32C19.53 7.68 19.79 8.05 20.04 8.44L18.64 9.84C18.31 9.21 17.91 8.62 17.45 9.13ZM19.87 5.87L18.5 4.5L3.5 19.5L4.87 20.87L7.42 18.32C8.32 18.76 9.32 19 10.38 19C15.32 19 19.26 16.39 21 12C20.41 10.9 19.62 9.93 18.67 9.14L20.05 7.76C20.79 8.63 21.5 9.72 22.08 11C20.53 14.87 16.5 17 12 17C10.83 17 9.72 16.79 8.7 16.4L11 14.1C11.61 14.35 12.29 14.5 13 14.5C14.93 14.5 16.5 12.93 16.5 11C16.5 10.32 16.35 9.68 16.1 9.07L19.87 5.87Z"/>
                            </svg>
                        </span>
                    </div>
                </div>
                <div class="form-group">
                    <button type="submit" class="register-button">Зарегистрироваться</button>
                </div>
                <div class="text-center">
                    <p>Или авторизуйтесь через:</p>
                    
                    <div class="auth-buttons">
                        <a href="{% provider_login_url 'google' %}" class="btn-google">
                            <span class="google-icon"></span> Вход через Google
                        </a>
                    </div>                    
                </div>
            </form>
        </div>
    </div>

    <script>
        // Логика для показа/скрытия пароля для первого поля
        const passwordInput1 = document.getElementById('password1');
        const togglePassword1 = document.getElementById('togglePassword1');
        const eyeOpen1 = document.getElementById('eyeOpen1');
        const eyeClosed1 = document.getElementById('eyeClosed1');

        togglePassword1.addEventListener('click', function() {
            if (passwordInput1.type === 'password') {
                passwordInput1.type = 'text';
                eyeOpen1.style.display = 'inline';
                eyeClosed1.style.display = 'none';
            } else {
                passwordInput1.type = 'password';
                eyeOpen1.style.display = 'none';
                eyeClosed1.style.display = 'inline';
            }
        });

        // Логика для показа/скрытия пароля для второго поля (Подтвердить пароль)
        const passwordInput2 = document.getElementById('password2');
        const togglePassword2 = document.getElementById('togglePassword2');
        const eyeOpen2 = document.getElementById('eyeOpen2');
        const eyeClosed2 = document.getElementById('eyeClosed2');

        togglePassword2.addEventListener('click', function() {
            if (passwordInput2.type === 'password') {
                passwordInput2.type = 'text';
                eyeOpen2.style.display = 'inline';
                eyeClosed2.style.display = 'none';
            } else {
                passwordInput2.type = 'password';
                eyeOpen2.style.display = 'none';
                eyeClosed2.style.display = 'inline';
            }
        });
    </script>
    <script src="{% static 'deps/js/account.js' %}"></script>
</body>
</html>
