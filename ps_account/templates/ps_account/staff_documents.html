{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор пользователя</title>
    <link rel="stylesheet" href="{% static 'deps/css/account_style.css' %}">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        nav {
            background-color: #2c3e50;
            padding: 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .user-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .user-item {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-item a {
            text-decoration: none;
            color: #2c3e50;
            font-weight: bold;
        }

        .user-item:hover {
            background-color: #ecf0f1;
        }
        .search-bar {
            margin-bottom: 20px;
            text-align: center;
        }
    
        .search-bar input[type="text"] {
            padding: 10px;
            width: 50%;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
    
        .search-bar button {
            padding: 10px 20px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    
        .search-bar button:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="{% url 'main:index' %}">Главная</a>
            <a href="{% url 'chat:index' %}">Чат</a>
            <a href="{% url 'ps_account:account' %}">Личный кабинет</a>
        </nav>

        <h1>Выберите пользователя для загрузки документов</h1>

        <div class="search-bar">
            <form method="GET">
                <input type="text" name="q" placeholder="Поиск по имени или email" value="{{ query }}">
                <button type="submit">Поиск</button>
            </form>
        </div>
        

        <div class="user-list">
            {% for user in users %}
                <div class="user-item">
                    <span>{{ user.get_full_name }} ({{ user.email }})</span>
                    <a href="{% url 'ps_account:user_account_for_staff' user.id %}">Перейти</a>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
