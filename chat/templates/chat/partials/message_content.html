{% if message.body %}
    <span>{{ message.body }}</span>
{% elif message.file %}
    {% if message.is_image %}
        <img class="max-w-72 min-w-8" src="{{ message.file.url }}" />
    {% else %}
        <!-- Показываем только имя файла без лишнего текста -->
        <a class="cursor-pointer italic hover:underline" href="{{ message.file.url }}" download>{{ message.file.name|slice:"9:" }}</a>
    {% endif %}
{% endif %}
